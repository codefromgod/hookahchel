<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Меню HookahPlace Челябинск</title>
<style>
:root{--bg:#0a0908;--red:#e11b22;--red-2:#ff3b41;--text:#f4efe9;--muted:#b7aca3;--gold:#d8b26a}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:Unbounded,'Segoe UI',system-ui,Arial,sans-serif;font-weight:700;line-height:1.15}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(18px);background:rgba(10,9,8,.72);border-bottom:1px solid rgba(255,255,255,.07)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 22px}
.brand{display:flex;flex-direction:column;text-decoration:none;line-height:1.05}
.brand b{font-family:Unbounded;font-size:14px;letter-spacing:.06em}
.brand span{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
.head{padding:64px 0 8px;text-align:center}
.head h1{font-size:clamp(30px,5vw,52px);margin:18px 0 14px}
.head p{color:var(--muted);max-width:640px;margin:0 auto}
.rests{display:flex;gap:12px;justify-content:center;margin:26px 0 0;flex-wrap:wrap}
.rest{font-family:Unbounded,sans-serif;font-size:14px;font-weight:700;letter-spacing:.04em;padding:13px 30px;border-radius:16px;cursor:pointer;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);transition:.25s;text-align:center}
.rest small{display:block;font-family:Manrope,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.08em;opacity:.72;margin-top:5px;text-transform:uppercase}
.rest:hover{color:var(--text);border-color:rgba(255,255,255,.28)}
.rest.on{color:#fff;background:linear-gradient(120deg,rgba(225,27,34,.85),rgba(200,18,26,.7));border-color:rgba(255,80,86,.6)}
.filters{position:sticky;top:72px;z-index:45;display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;max-width:1180px;margin:0 auto;padding:10px 14px 12px;background:rgba(10,9,8,.94);border:1px solid rgba(255,255,255,.08);border-top:0;border-radius:0 0 18px 18px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{font-family:Manrope;font-size:12px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:9px 14px;cursor:pointer;white-space:nowrap;flex:0 0 auto;transition:.25s}
.chip:hover{color:var(--text);border-color:rgba(255,255,255,.25)}
.chip.on{color:#fff;background:var(--red);border-color:var(--red-2)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:26px 0 80px}
.dish{border-radius:20px;overflow:hidden;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;transition:transform .35s ease,box-shadow .35s ease;cursor:pointer}
.dish:hover{transform:translateY(-6px);box-shadow:0 24px 50px -20px rgba(0,0,0,.8),0 0 0 1px rgba(225,27,34,.25)}
.dish-img{aspect-ratio:4/3;overflow:hidden;position:relative;background:radial-gradient(120% 120% at 50% 0%,rgba(225,27,34,.16),rgba(10,9,8,.9))}
.dish-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.dish:hover .dish-img img{transform:scale(1.06)}
.dish-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.dish-body h3{font-size:15px;font-weight:600;line-height:1.3}
.dish-body p{font-size:13px;color:var(--muted);line-height:1.55;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dish-foot{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.dish-price{font-family:Unbounded;font-size:17px;font-weight:700;color:var(--red-2)}
.dish-w{font-size:12.5px;color:var(--muted)}
.dish-star{color:var(--gold);margin-left:6px}
.hp-cart-ctl{margin-top:11px}
.hp-add{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 0;border-radius:12px;border:1px solid rgba(216,178,106,.5);background:linear-gradient(120deg,rgba(216,178,106,.16),rgba(216,178,106,.05));color:var(--gold);font-size:13px;font-weight:800;cursor:pointer;transition:.2s}
.hp-add:hover{background:var(--gold);color:#1a1410;border-color:var(--gold)}
.hp-step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px;border-radius:12px;border:1px solid rgba(216,178,106,.45);background:rgba(216,178,106,.1)}
.hp-step button{width:34px;height:34px;border:none;border-radius:9px;background:rgba(225,27,34,.9);color:#fff;font-size:20px;cursor:pointer}
.hp-step .hp-q{font-family:Unbounded;font-weight:700;font-size:15px;color:#fff;min-width:24px;text-align:center}
.hide{display:none!important}
footer{border-top:1px solid rgba(255,255,255,.07);padding:34px 0 44px;text-align:center;color:var(--muted);font-size:13.5px}
/* modal, cart, fab — см. полный файл */
@media(max-width:1080px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.filters{top:66px}}
@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<header>
<div class="nav">
<a class="brand" href="/"><b>HOOKAHPLACE</b><span>Челябинск</span></a>
</div>
</header>

<section class="head wrap">
<h1>Меню</h1>
<p>У каждой точки — своя авторская кухня. Выберите рестобар.</p>
<div class="rests" id="rests"></div>
</section>

<nav class="filters" id="filters"></nav>

<main class="wrap">
<div class="grid" id="grid"></div>
<p id="loading" style="text-align:center;color:var(--muted);padding:60px 0">Загрузка меню…</p>
<p id="error" style="display:none;text-align:center;color:var(--red-2);padding:60px 0"></p>
</main>

<footer><div class="wrap"><p><b>HookahPlace Челябинск</b> · Цены в рублях · 18+</p></div></footer>

<!-- корзина, модалка, FAB — как в оригинале -->

<script>
// ============ КОНФИГ ============
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQFdfSTE3-ixLkd5HR8tgoL96fbJU1-Kn-vivn4mDqZrc8lO0kxtvHFEYMGEg3yq6djZVnjo3RsTTzt/pubhtml';
const REST_NAMES = {pravda:'ПРАВДА', soyuz:'СОЮЗ'};
const REST_ADDR  = {pravda:'пр. Ленина, 64', soyuz:'ул. Цвиллинга, 25'};
// =================================

let MENU = [];
const state = {rest:'pravda', cat:'all', q:''};

// --- CSV parser (поддерживает кавычки, переводы строк внутри) ---
function parseCSV(text){
  const rows=[]; let row=[], cell='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(inQ){
      if(c==='"' && n==='"'){cell+='"';i++;}
      else if(c==='"'){inQ=false;}
      else cell+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){row.push(cell);cell='';}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
      else if(c==='\r'){}
      else cell+=c;
    }
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.length&&r[0]).map(r=>{
    const o={}; head.forEach((h,i)=>o[h]=(r[i]||'').trim()); return o;
  });
}

// --- Рендер ---
function renderRests(){
  document.getElementById('rests').innerHTML = Object.keys(REST_NAMES).map(r=>
    `<button class="rest ${state.rest===r?'on':''}" data-r="${r}">${REST_NAMES[r]}<small>${REST_ADDR[r]}</small></button>`
  ).join('');
  document.querySelectorAll('.rest').forEach(b=>b.onclick=()=>{
    state.rest=b.dataset.r; state.cat='all'; state.q='';
    renderRests(); renderFilters(); renderGrid();
  });
}

function renderFilters(){
  const cats = [...new Set(MENU.filter(d=>d.rest===state.rest).map(d=>d.category))];
  document.getElementById('filters').innerHTML =
    `<button class="chip ${state.cat==='all'?'on':''}" data-f="all">Все</button>` +
    cats.map(c=>`<button class="chip ${state.cat===c?'on':''}" data-f="${c}">${c}</button>`).join('');
  document.querySelectorAll('#filters .chip').forEach(b=>b.onclick=()=>{
    state.cat=b.dataset.f; renderFilters(); renderGrid();
  });
}

function cardHTML(d){
  const imgs = (d.images||'').split('|').filter(Boolean);
  const main = imgs[0]||'';
  const star = d.popular==='1'?'<span class="dish-star">★</span>':'';
  return `<article class="dish" data-id="${d.id}">
    <div class="dish-img">${main?`<img src="${main}" alt="${d.name}" loading="lazy">`:''}</div>
    <div class="dish-body">
      <h3>${d.name}${star}</h3>
      <p>${d.description||''}</p>
      <div class="dish-foot">
        <span class="dish-price">${d.price?Number(d.price).toLocaleString('ru-RU')+' ₽':''}</span>
        <span class="dish-w">${d.weight||''}</span>
      </div>
      <div class="hp-cart-ctl">
        <button class="hp-add" type="button">+ В корзину</button>
      </div>
    </div>
  </article>`;
}

function renderGrid(){
  const list = MENU.filter(d=>
    d.rest===state.rest &&
    (state.cat==='all'||d.category===state.cat) &&
    (!state.q || (d.name+' '+d.description).toLowerCase().includes(state.q.toLowerCase()))
  );
  const g=document.getElementById('grid');
  g.innerHTML = list.map(cardHTML).join('');
  g.querySelectorAll('.dish').forEach(c=>c.onclick=()=>openModal(c.dataset.id));
  g.querySelectorAll('.hp-add').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const id=b.closest('.dish').dataset.id;
    addToCart(id);
  });
}

// --- Модалка (галерея, состав, рекомендации, заказ) ---
function openModal(id){
  const d = MENU.find(x=>x.id===id); if(!d) return;
  // ...рендер модалки с галереей, составом, order_url...
  console.log('open', d);
}

// --- Корзина ---
function addToCart(id){
  const d = MENU.find(x=>x.id===id); if(!d||!d.price) return;
  console.log('add', d);
  // ...логика корзины...
}

// --- Загрузка ---
fetch(CSV_URL)
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
  .then(text=>{
    MENU = parseCSV(text).filter(d=>d.id && d.price);
    document.getElementById('loading').style.display='none';
    renderRests(); renderFilters(); renderGrid();
  })
  .catch(e=>{
    document.getElementById('loading').style.display='none';
    const err=document.getElementById('error');
    err.style.display='block';
    err.textContent='Не удалось загрузить меню: '+e.message;
  });

// --- Поиск ---
const search = document.createElement('input');
search.placeholder='Поиск по меню…';
search.style.cssText='display:block;margin:24px auto 0;padding:14px 20px;width:min(560px,90%);border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;font-size:15px';
search.oninput=()=>{state.q=search.value;renderGrid();};
document.querySelector('.head').appendChild(search);
</script>

</body>
</html>
